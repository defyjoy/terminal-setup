# tmux.conf — beautified 2026-09-05 (original was: "set -g mouse on")

# --- basics ---
set -g mouse on
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
set -g history-limit 50000
set -g escape-time 0
set -sg repeat-time 400
set -g set-titles on
set -g focus-events on

# Split with | and -, prefix preserved, stay in current dir
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim-style pane switching
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes
bind -r H resize-pane -L 3
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 3

# Activity bell + status
setw -g monitor-activity on
set -g visual-activity off

# --- status bar ---
set -g status-position bottom
set -g status-style "bg=#111827,fg=#e5e7eb"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bold,colour=green] ❯ #S #[default]| "
set -g status-right " %H:%M "
set -g window-status-current-format "#[bold,colour=cyan] #I:#F#[default] "
set -g window-status-format " #I:#F "
set -g window-status-separator "  "
